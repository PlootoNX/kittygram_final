version: '3'

volumes:
  kitty_pg_data:
  kitty_static:
  kitty_media:


services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - kitty_pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    env_file: .env
    volumes:
      - kitty_static:/backend_static
      - kitty_media:/media
  frontend:
    env_file: .env
    build: ./frontend/
    command: cp -r /app/build/. /static/
    volumes:
      - kitty_static:/static
  gateway:
    build: ./gateway/
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - kitty_static:/static
      - kitty_media:/media
